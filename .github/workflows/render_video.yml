name: Editorial explainer render
on:
  workflow_dispatch:
  push:
    branches: [arena/fa1317bb-ans-malik]
    paths:
      - 'editorial_render.py'
      - 'forge_python/editorial_audio.py'
      - 'forge_python/audio_mastering/**'
      - 'forge_python/render/voice.py'
      - 'shared_workspace/fonts/**'
      - 'web/editorial/**'
      - 'scripts/editorial_qa.py'
      - 'scripts/fit_github_video.py'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/render_video.yml'
permissions:
  contents: write
concurrency:
  group: editorial-render-output
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/fa1317bb-ans-malik
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Render 15 seconds in Chromium with neural voice and word alignment
        run: python editorial_render.py --output renders/final_video.mp4 --require-online --whisper-model base.en
      - name: Fit complete video under GitHub's file limit
        run: python -m scripts.fit_github_video renders/final_video.mp4
      - name: Verify video and make contact sheet
        run: python -m scripts.editorial_qa renders/final_video.mp4 renders/qa_contact_sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-explainer
          if-no-files-found: error
          path: |
            renders/final_video.mp4
            renders/final_video.mp4.json
            renders/qa_contact_sheet.png
      - name: Commit outputs to the session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f renders/final_video.mp4 renders/final_video.mp4.json renders/qa_contact_sheet.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add editorial explainer render [skip ci]'
          git pull --rebase origin arena/fa1317bb-ans-malik
          git push origin arena/fa1317bb-ans-malik
