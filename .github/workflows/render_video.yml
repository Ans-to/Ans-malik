name: Continuous morph render
on:
  workflow_dispatch:
  push:
    branches: [main, arena/fa1317bb-ans-malik]
permissions:
  contents: write
concurrency:
  group: mixed-media-visual-v2
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/fa1317bb-ans-malik
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Render word-locked safe-zone visuals against locked narration
        run: |
          set -o pipefail
          python semantic_render.py --source renders/final_video.mp4 --output renders/final_video.mp4 2>&1 | tee render.log || {
            tail -n 3 render.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Fit complete video under GitHub's file limit
        run: python -m scripts.fit_github_video renders/final_video.mp4
      - name: Verify video and make contact sheet
        run: |
          set -o pipefail
          python -m scripts.morph_qa renders/final_video.mp4 renders/qa_contact_sheet.png 2>&1 | tee qa.log || {
            tail -n 5 qa.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: continuous-morph-explainer
          if-no-files-found: error
          path: |
            renders/final_video.mp4
            renders/final_video.mp4.json
            renders/qa_contact_sheet.png
      - name: Commit outputs to the session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f renders/final_video.mp4 renders/final_video.mp4.json renders/qa_contact_sheet.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add continuous morph render [skip ci]'
          git pull --rebase origin arena/fa1317bb-ans-malik
          git push origin arena/fa1317bb-ans-malik
