name: blender-film

# Renders SILICON (15 s) on GitHub-hosted runners: Blender headless for picture, Kokoro for the
# voice-over, a synthesised score, then an ffmpeg master and an objective gate pass on the result.
#
#   gh workflow run blender-film -f preset=preview   # 960x540 / 12 spp, 4 shards,  ~20 min
#   gh workflow run blender-film -f preset=final     # 1920x1080 / 16 spp, 8 shards, ~60 min
#
# A standard runner is 2 vCPU. One 1080p Cycles pass takes hours on that, so the final is split into
# per-frame-range shards that render in parallel and are stitched by a final job.

on:
  # The token available in this environment cannot dispatch workflows (it has no `workflow` scope),
  # so a push is the trigger. Which preset runs is read from blender-film/run_preset.
  push:
    paths:
      - "blender-film/**"
      - ".github/workflows/blender-film.yml"
  workflow_dispatch:
    inputs:
      preset:
        description: "Render preset"
        type: choice
        options: [preview, final]
        default: preview
      skip_voice:
        description: "Skip Kokoro (tests the pipeline without the model download)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  BLENDER_URL: "https://download.blender.org/release/Blender4.2/blender-4.2.19-linux-x64.tar.xz"
  BLENDER_KEY: "blender-4.2.19-linux-x64"
  KOKORO_TAG: "model-files-v1.0"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      preset: ${{ steps.p.outputs.preset }}
      shards: ${{ steps.p.outputs.shards }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        run: |
          P="${{ inputs.preset }}"
          if [ -z "$P" ]; then
            P=$(cat blender-film/run_preset 2>/dev/null | tr -d '[:space:]')
            [ -z "$P" ] && P=preview
          fi
          # 2 vCPU runners: shard even the preview, or iteration takes an hour per look
          if [ "$P" = "final" ]; then N=8; else N=4; fi
          echo "preset=$P" >> "$GITHUB_OUTPUT"
          echo "shards=$N" >> "$GITHUB_OUTPUT"
          M=$(python3 -c "import json; print(json.dumps({'shard': list(range($N))}))")
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "preset=$P shards=$N matrix=$M"

  # ---- sound first: it is cheap, and the picture is timed to it
  audio:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -qq update || true
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          fi
          if ! command -v ffmpeg >/dev/null; then
            curl -sSL --retry 3 -o /tmp/ff.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ffstatic && tar -xf /tmp/ff.tar.xz -C /tmp/ffstatic --strip-components=1
            sudo cp /tmp/ffstatic/ffmpeg /tmp/ffstatic/ffprobe /usr/local/bin/
          fi
          ffmpeg -version > /tmp/ffv.txt 2>&1; head -1 /tmp/ffv.txt

      - name: Cache Kokoro model
        if: ${{ inputs.skip_voice != true }}
        uses: actions/cache@v5
        with:
          path: /opt/kokoro
          key: kokoro-${{ env.KOKORO_TAG }}

      - name: Fetch Kokoro weights
        if: ${{ inputs.skip_voice != true }}
        run: |
          mkdir -p /opt/kokoro
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/$KOKORO_TAG"
          [ -s /opt/kokoro/kokoro-v1.0.onnx ] || curl -sSL --retry 3 -o /opt/kokoro/kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s /opt/kokoro/voices-v1.0.bin ] || curl -sSL --retry 3 -o /opt/kokoro/voices-v1.0.bin "$base/voices-v1.0.bin"
          ls -lh /opt/kokoro
          python3 -m pip -q install numpy kokoro-onnx

      - name: Voice-over (Kokoro)
        if: ${{ inputs.skip_voice != true }}
        run: |
          bash blender-film/ci_run.sh "voiceover" \
            python3 blender-film/vo.py \
              --out blender-film/out/vo.wav \
              --model /opt/kokoro/kokoro-v1.0.onnx \
              --voices /opt/kokoro/voices-v1.0.bin
          ls -lh blender-film/out/vo.wav

      - name: Score + mix
        run: |
          bash blender-film/ci_run.sh "score" \
            python3 blender-film/score.py --vo blender-film/out/vo.wav --out blender-film/out/mix.wav
          bash blender-film/ci_run.sh "loudnorm" \
            ffmpeg -y -v error -i blender-film/out/mix.wav \
              -af "loudnorm=I=-16:TP=-1.0:LRA=11,alimiter=limit=0.85:attack=4:release=80:level=false" -ar 48000 -ac 2 \
              blender-film/out/soundtrack.wav

      - uses: actions/upload-artifact@v5
        with:
          name: audio
          retention-days: 7
          path: |
            blender-film/out/soundtrack.wav
            blender-film/out/vo_times.json
            blender-film/out/score_stats.json

  # ---- picture, split by frame range
  shard:
    needs: [setup, audio]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      # Blender links the X11/GL stack even in background mode; without these it exits on load.
      # One package at a time: a renamed package (the t64 transition) must not kill the job.
      - name: System libraries
        run: |
          sudo apt-get -qq update || true
          for p in libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libsm6 libice6 libxt6 \
                   libgl1 libegl1 libgomp1 libxkbcommon0 libx11-xcb1 libxcb1; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "$p" >/dev/null 2>&1 \
              && echo "ok   $p" || echo "::warning::could not install $p"
          done

      - name: Cache Blender
        uses: actions/cache@v5
        with:
          path: /opt/blender
          key: ${{ env.BLENDER_KEY }}

      - name: Install Blender
        run: |
          if [ ! -x /opt/blender/blender ]; then
            curl -sSL --retry 3 -o /tmp/blender.tar.xz "$BLENDER_URL"
            mkdir -p /opt/blender
            tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          fi
          if ! /opt/blender/blender --version > /tmp/bv.txt 2>&1; then
            echo "::error::blender --version failed: $(tr '\n' '|' < /tmp/bv.txt | head -c 600)"
            ldd /opt/blender/blender 2>/dev/null | grep "not found" | while read -r l; do
              echo "::error::missing shared library:$l"
            done
            exit 1
          fi
          head -3 /tmp/bv.txt

      - name: Frame range for this shard
        id: r
        run: |
          P="${{ needs.setup.outputs.preset }}"
          N="${{ needs.setup.outputs.shards }}"
          I="${{ matrix.shard }}"
          read -r S E <<< $(python3 -c "
          total=450; n=$N; i=$I
          per=-(-total//n)
          s=i*per+1; e=min(total,(i+1)*per)
          print(s,e)")
          echo "start=$S" >> "$GITHUB_OUTPUT"
          echo "end=$E" >> "$GITHUB_OUTPUT"
          echo "preset=$P shard=$I/$N frames $S..$E"

      - name: Smoke test (build + 3 frames)
        if: ${{ matrix.shard == 0 }}
        run: |
          # --python-exit-code: without it Blender exits 0 even when the script throws
          bash blender-film/ci_run.sh "smoke" \
            /opt/blender/blender --background --factory-startup --python-exit-code 1 \
              --python blender-film/scene.py -- \
              --preset "${{ needs.setup.outputs.preset }}" --out blender-film/out \
              --smoke "${{ steps.r.outputs.start }},225,${{ steps.r.outputs.end }}"

      - name: Render frames ${{ steps.r.outputs.start }}-${{ steps.r.outputs.end }}
        run: |
          bash blender-film/ci_run.sh "render" \
            /opt/blender/blender --background --factory-startup --python-exit-code 1 \
              --python blender-film/scene.py -- \
              --preset "${{ needs.setup.outputs.preset }}" --out blender-film/out \
              --frame-start "${{ steps.r.outputs.start }}" --frame-end "${{ steps.r.outputs.end }}"
          P="${{ needs.setup.outputs.preset }}"
          echo "frames this shard: $(ls "blender-film/out/frames_${P}" | wc -l)"
          du -sh "blender-film/out/frames_${P}"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frames-${{ matrix.shard }}
          retention-days: 3
          path: |
            blender-film/out/frames_*/
            blender-film/out/manifest_*.json
          if-no-files-found: warn
          compression-level: 0

  # ---- stitch, encode, gate
  deliver:
    needs: [setup, shard, audio]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -qq update || true
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          fi
          ffmpeg -version > /tmp/ffv.txt 2>&1; head -1 /tmp/ffv.txt

      - uses: actions/download-artifact@v5
        with:
          name: audio
          path: blender-film/out

      - uses: actions/download-artifact@v5
        with:
          pattern: frames-*
          path: blender-film/out
          merge-multiple: true

      - name: Encode master
        run: |
          P="${{ needs.setup.outputs.preset }}"
          echo "frames: $(ls blender-film/out/frames_${P} | wc -l)"
          bash blender-film/ci_run.sh "encode" \
          ffmpeg -y -v error -framerate 30 -start_number 1 \
            -i "blender-film/out/frames_${P}/f_%04d.png" \
            -i blender-film/out/soundtrack.wav \
            -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -profile:v high \
            -x264-params "aq-mode=3:deblock=-1,-1" \
            -c:a aac -b:a 256k -ar 48000 \
            -movflags +faststart -shortest \
            "blender-film/out/silicon_${P}.mp4"
          ls -lh "blender-film/out/silicon_${P}.mp4"

      - name: Analysis deps
        run: |
          python3 -m pip install --break-system-packages -q numpy 2>&1 | tail -3
          python3 -c "import numpy; print('numpy', numpy.__version__)"

      - name: Gates
        run: |
          P="${{ needs.setup.outputs.preset }}"
          M="blender-film/out/manifest_${P}.json"
          if [ ! -f "$M" ]; then
            echo "::error::no manifest arrived from the shards, so the layout and type gates cannot run"
            ls -R blender-film/out | head -20
            exit 1
          fi
          set +e
          python3 blender-film/gates.py \
            --video "blender-film/out/silicon_${P}.mp4" \
            --audio blender-film/out/soundtrack.wav \
            --manifest "$M" \
            --json "blender-film/out/gates_${P}.json" > "blender-film/out/gates_${P}.txt" 2>&1
          rc=$?
          set -e
          # Job logs are unreachable from where this is watched; annotations are not.
          python3 blender-film/report.py --json "blender-film/out/gates_${P}.json" \
            --log "blender-film/out/gates_${P}.txt" --rc "$rc" --label "gates ${P}"

      - name: Contact sheet
        if: always()
        run: |
          P="${{ needs.setup.outputs.preset }}"
          V="blender-film/out/silicon_${P}.mp4"
          [ -f "$V" ] && ffmpeg -y -v error -i "$V" \
            -vf "fps=1,scale=480:-1,tile=4x4" -frames:v 1 \
            "blender-film/out/contact_${P}.png" || true
          ls -lh blender-film/out/*.mp4 blender-film/out/*.png 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: silicon-${{ needs.setup.outputs.preset }}
          retention-days: 7
          path: |
            blender-film/out/silicon_*.mp4
            blender-film/out/gates_*.json
            blender-film/out/manifest_*.json
            blender-film/out/contact_*.png
          if-no-files-found: warn
